# fly.toml — configuração do app no Fly.io
# Docs: https://fly.io/docs/reference/configuration/
app = "convida-me"
primary_region = "gru"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # 1 = app sempre no ar; 0 = hiberna quando ocioso (mais barato,
  # ~1s de cold start na primeira visita)
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/up"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
