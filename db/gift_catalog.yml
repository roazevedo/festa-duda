# ════════════════════════════════════════════════════════════
# CATÁLOGO DE PRESENTES SUGERIDOS
# Fonte da verdade do catálogo, agrupado por tipo de evento
# (ids validados em app/models/event.rb). A ordem da lista vira
# a posição de exibição.
#
# Após editar, aplique com:  rails catalog:sync
# (em produção: fly ssh console -C "bin/rails catalog:sync")
#
# image_url: URL completa no Cloudinary (pasta festa-duda/catalogo).
# Pode ficar em branco — o frontend usa um fallback sem foto.
# Os comentários "# foto:" registram a origem e a licença de cada
# imagem (todas CC0 ou domínio público, sem exigência de crédito).
# ════════════════════════════════════════════════════════════

